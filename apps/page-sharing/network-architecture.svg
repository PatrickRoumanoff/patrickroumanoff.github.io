<svg width="680" height="392" viewBox="0 0 680 392" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>Where your data goes — Page Sharing data flow</title>
  <desc>Two Confluence sites separated by a boundary. The publisher generates a share link containing a token and hands it to the subscriber on the frontend, out of band. Over a single Atlassian-hosted endpoint the publisher's app sends the page content to the subscriber's app, and the subscriber's app sends subscribe or cancel requests back. On the publisher side the app only reads the source page — it never writes it. On the subscriber side the app only writes the synced copy — the original is never changed. There are no third-party servers in the path.</desc>
  <defs>
    <marker id="chev" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#5c6b7e" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="392" rx="12" fill="#ffffff"/>

  <!-- boundary between the two sites -->
  <line x1="340" y1="24" x2="340" y2="330" stroke="#9aa7b8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="340" y="16" text-anchor="middle" font-size="12" fill="#5c6b7e">boundary between the two sites</text>

  <!-- Row A: frontend actors (browsers) -->
  <rect x="45" y="44" width="230" height="46" rx="8" fill="#eaf1fb" stroke="#2e6fe0"/>
  <text x="160" y="67" text-anchor="middle" font-size="14" font-weight="600" fill="#1b4fb0">Publisher</text>
  <text x="160" y="82" text-anchor="middle" font-size="12" fill="#2e6fe0">shares a page they own</text>

  <rect x="405" y="44" width="230" height="46" rx="8" fill="#eaf1fb" stroke="#2e6fe0"/>
  <text x="520" y="67" text-anchor="middle" font-size="14" font-weight="600" fill="#1b4fb0">Subscriber</text>
  <text x="520" y="82" text-anchor="middle" font-size="12" fill="#2e6fe0">gets a read-only copy</text>

  <!-- token / share link handed over on the frontend (dashed = out of band) -->
  <line x1="278" y1="66" x2="398" y2="66" stroke="#2e6fe0" stroke-width="2" stroke-dasharray="4 3"/>
  <polygon points="404,66 395,61 395,71" fill="#2e6fe0"/>
  <text x="340" y="56" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1b4fb0">share link + token</text>
  <text x="340" y="82" text-anchor="middle" font-size="10.5" fill="#2e6fe0">generated by publisher</text>

  <!-- browser uses the app -->
  <line x1="160" y1="92" x2="160" y2="148" stroke="#9aa7b8" stroke-width="1.5" marker-end="url(#chev)"/>
  <text x="168" y="122" text-anchor="start" font-size="11" fill="#5c6b7e">uses</text>
  <line x1="520" y1="92" x2="520" y2="148" stroke="#9aa7b8" stroke-width="1.5" marker-end="url(#chev)"/>
  <text x="528" y="122" text-anchor="start" font-size="11" fill="#5c6b7e">uses</text>

  <!-- single Atlassian-hosted endpoint, on the boundary -->
  <rect x="250" y="102" width="180" height="30" rx="8" fill="#faeeda" stroke="#854f0b"/>
  <text x="340" y="116" text-anchor="middle" font-size="12" font-weight="600" fill="#633806">one Atlassian endpoint</text>
  <text x="340" y="127" text-anchor="middle" font-size="10.5" fill="#854f0b">no third-party servers</text>

  <!-- Row B: the app (Atlassian Forge) -->
  <rect x="45" y="150" width="230" height="58" rx="8" fill="#eaf1fb" stroke="#2e6fe0"/>
  <text x="160" y="174" text-anchor="middle" font-size="14" font-weight="600" fill="#1b4fb0">Page Sharing app</text>
  <text x="160" y="189" text-anchor="middle" font-size="12" fill="#2e6fe0">runs on Atlassian Forge</text>

  <rect x="405" y="150" width="230" height="58" rx="8" fill="#eaf1fb" stroke="#2e6fe0"/>
  <text x="520" y="174" text-anchor="middle" font-size="14" font-weight="600" fill="#1b4fb0">Page Sharing app</text>
  <text x="520" y="189" text-anchor="middle" font-size="12" fill="#2e6fe0">runs on Atlassian Forge</text>

  <!-- app-to-app traffic over the endpoint (solid amber) -->
  <line x1="278" y1="172" x2="397" y2="172" stroke="#ba7517" stroke-width="2.5"/>
  <polygon points="403,172 394,167 394,177" fill="#ba7517"/>
  <text x="340" y="165" text-anchor="middle" font-size="10.5" fill="#854f0b">page content</text>

  <line x1="402" y1="192" x2="283" y2="192" stroke="#ba7517" stroke-width="2.5"/>
  <polygon points="277,192 286,187 286,197" fill="#ba7517"/>
  <text x="340" y="204" text-anchor="middle" font-size="10.5" fill="#854f0b">subscribe / cancel</text>

  <!-- Row C: the Confluence pages, with the read-only / write-only asymmetry -->
  <rect x="45" y="266" width="230" height="52" rx="8" fill="#f4f7fb" stroke="#c8d2e0"/>
  <text x="160" y="289" text-anchor="middle" font-size="14" font-weight="600" fill="#13243b">Publisher's page</text>
  <text x="160" y="305" text-anchor="middle" font-size="12" fill="#3a4a60">the original — never changed</text>

  <rect x="405" y="266" width="230" height="52" rx="8" fill="#f4f7fb" stroke="#c8d2e0"/>
  <text x="520" y="289" text-anchor="middle" font-size="14" font-weight="600" fill="#13243b">Subscriber's copy</text>
  <text x="520" y="305" text-anchor="middle" font-size="12" fill="#3a4a60">created &amp; kept in sync</text>

  <!-- publisher side: READ only (arrow points up, out of the page) -->
  <line x1="160" y1="264" x2="160" y2="212" stroke="#9aa7b8" stroke-width="1.5" marker-end="url(#chev)"/>
  <text x="172" y="234" text-anchor="start" font-size="11" font-weight="600" fill="#3a4a60">reads only</text>
  <text x="172" y="248" text-anchor="start" font-size="10.5" fill="#5c6b7e">never writes it</text>

  <!-- subscriber side: WRITE only (arrow points down, into the page) -->
  <line x1="520" y1="212" x2="520" y2="264" stroke="#9aa7b8" stroke-width="1.5" marker-end="url(#chev)"/>
  <text x="508" y="234" text-anchor="end" font-size="11" font-weight="600" fill="#3a4a60">writes only</text>
  <text x="508" y="248" text-anchor="end" font-size="10.5" fill="#5c6b7e">never reads it</text>

  <!-- legend -->
  <rect x="45" y="344" width="12" height="12" rx="3" fill="#eaf1fb" stroke="#2e6fe0"/>
  <text x="63" y="354" text-anchor="start" font-size="11" fill="#5c6b7e">Page Sharing app</text>
  <rect x="205" y="344" width="12" height="12" rx="3" fill="#f4f7fb" stroke="#c8d2e0"/>
  <text x="223" y="354" text-anchor="start" font-size="11" fill="#5c6b7e">your Confluence page</text>
  <rect x="390" y="344" width="12" height="12" rx="3" fill="#faeeda" stroke="#854f0b"/>
  <text x="408" y="354" text-anchor="start" font-size="11" fill="#5c6b7e">app-to-app channel</text>
  <text x="45" y="378" text-anchor="start" font-size="10.5" fill="#5c6b7e">Dashed blue = share link handed over on the frontend (out of band).  Amber = data over the Atlassian endpoint.</text>
</svg>
