name: Tech Adoption Radar for Confluence
slug: radar-renderer
order: 35
status: coming-soon
homepage_visible: true
featured: false
platform: Forge
description: Engineering teams that maintain a tech radar often keep it in a place their colleagues do not visit, a hosted build-your-own-radar site, a static build, or a screenshot pasted into a page and left to go stale. This macro renders a pasted CSV or JSON blip list as a quadrant tech radar directly in the Confluence page, so the radar sits next to the documentation it explains instead of behind an external link. It accepts both the Thoughtworks build-your-own-radar CSV convention and the Zalando radar.js JSON dialect, so a team already running either tool can paste an existing file rather than rebuild one. The blip list stays canonical text in the page body, edit a ring assignment and the same layout re-renders deterministically, with the change visible in Confluence's own page history. Export to PDF or Word keeps a structured table by quadrant and ring, and a client-side "Download as image" button covers a static copy when one is needed. The app runs with zero scopes and zero egress, and stores nothing outside Confluence's native page content.
